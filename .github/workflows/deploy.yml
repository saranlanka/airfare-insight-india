name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Find build output
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== DIRECTORIES ====="
          find . -maxdepth 3 -type d | sort
          echo "===== HTML FILES ====="
          find . -type f -name "*.html" | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages
        run: |
          if [ -d ".output/public" ]; then
            echo "Using .output/public"
            mkdir -p pages
            cp -r .output/public/* pages/
          elif [ -d "dist" ]; then
            echo "Using dist"
            mkdir -p pages
            cp -r dist/* pages/
          else
            echo "ERROR: No static build directory found"
            exit 1
          fi

          touch pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
